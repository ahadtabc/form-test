<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Submit your application securely. Fill in your details to apply for a position."
    >

    <title>Application Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Animated Background -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>


    <main class="page">

        <section class="form-card" role="main">

            <!-- Header -->
            <div class="form-header">

                <div class="logo-wrap">
                    <div class="logo" aria-label="Application Form">
                        <span class="logo-icon">✦</span>
                    </div>
                </div>

                <div class="header-text">
                    <h1>Application Form</h1>
                    <p>Submit your details below. We'll get back to you shortly.</p>
                </div>

            </div>


            <!-- Form -->
            <form id="applicationForm" novalidate>

                <!-- Row: Name + Email -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Full Name <span class="req">*</span></label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Your full name"
                                required
                                autocomplete="name"
                            >
                        </div>
                        <span class="field-error" id="name-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="req">*</span></label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            </span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                        <span class="field-error" id="email-error"></span>
                    </div>

                </div>


                <!-- Row: Phone + Position -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="phone">Phone Number <span class="req">*</span></label>
                        <div class="input-wrap phone-wrap">
                            <div class="phone-prefix">
                                <img
                                    src="https://flagcdn.com/w20/in.png"
                                    alt="India flag"
                                    class="flag-img"
                                    width="20"
                                    height="14"
                                >
                                <span class="prefix-code">+91</span>
                            </div>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="98765 43210"
                                maxlength="10"
                                pattern="[6-9][0-9]{9}"
                                required
                                autocomplete="tel"
                            >
                        </div>
                        <span class="field-error" id="phone-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="position">Applying For <span class="req">*</span></label>
                        <div class="input-wrap select-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                            </span>
                            <select id="position" name="position" required>
                                <option value="">Select a position</option>
                                <option value="IT Support Specialist">IT Support Specialist</option>
                                <option value="Web Developer">Web Developer</option>
                                <option value="Software Developer">Software Developer</option>
                                <option value="Other">Other</option>
                            </select>
                            <span class="select-arrow">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                            </span>
                        </div>
                        <span class="field-error" id="position-error"></span>
                    </div>

                </div>


                <!-- Batch -->
                <div class="form-group">
                    <label for="batch">Batch</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                        </span>
                        <input
                            type="text"
                            id="batch"
                            name="batch"
                            placeholder="BCK327"
                            autocomplete="off"
                            style="text-transform: uppercase;"
                        >
                    </div>
                </div>


                <!-- Message -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <div class="input-wrap textarea-wrap">
                        <span class="input-icon textarea-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </span>
                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            placeholder="Tell us something about yourself…"
                        ></textarea>
                    </div>
                </div>


                <!-- Submit -->
                <button type="submit" id="submitButton">
                    <span class="btn-text">Submit Application</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </span>
                </button>


                <!-- Status -->
                <div id="statusMessage" class="status-message" role="alert" aria-live="polite"></div>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
