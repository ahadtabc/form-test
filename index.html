<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Application Form</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="page">

        <section class="form-card">

            <div class="form-header">

                <div class="logo">
                    AF
                </div>

                <h1>
                    Application Form
                </h1>

                <p>
                    Fill in the form below to submit your application.
                </p>

            </div>


            <form id="applicationForm">

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- Position -->

                <div class="form-group">

                    <label for="position">
                        Applying For
                    </label>

                    <select
                        id="position"
                        name="position"
                        required
                    >

                        <option value="">
                            Select a position
                        </option>

                        <option value="IT Support Specialist">
                            IT Support Specialist
                        </option>

                        <option value="Web Developer">
                            Web Developer
                        </option>

                        <option value="Software Developer">
                            Software Developer
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Message -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Tell us something about yourself..."
                    ></textarea>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    id="submitButton"
                >

                    Submit Application

                </button>


                <!-- Status -->

                <div
                    id="statusMessage"
                    class="status-message"
                ></div>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
